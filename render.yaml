services:
  - type: web
    name: readflow-api
    env: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: readflow-postgres
          property: connectionString
      - key: API_KEY
        sync: false

databases:
  - name: readflow-postgres
    plan: free
